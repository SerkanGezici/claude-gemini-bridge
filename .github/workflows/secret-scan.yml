name: Secret scan

# pull_request tetiği yok: ücretsiz planda Actions dakikası tüm private repolarda ortak ve dal koruması
# yok; PR + birleşme aynı değişikliği iki kez koşuyordu. concurrency/cancel bilerek YOK: gitleaks push'ta
# yalnız o push'un commit aralığını tarar, iptal edilen koşunun commit'leri hiç taranmamış kalırdı.
on:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
